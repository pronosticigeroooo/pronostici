name: Backtest (temporaneo)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backtest.py
      - run: |
          git config user.name "pronostici-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/backtest.html
          git diff --cached --quiet || (git commit -m "Backtest" && git push)
