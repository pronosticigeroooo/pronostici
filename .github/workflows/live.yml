name: Risultati live
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scrittura-repo
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python live.py
        env:
          BSD_KEY: ${{ secrets.BSD_KEY }}
      - run: |
          git config user.name "pronostici-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/live.json
          git diff --cached --quiet || (git commit -m "Live" && git pull --rebase origin main && git push)
