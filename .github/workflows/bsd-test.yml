name: Test BSD (temporaneo)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bsd_probe.py
        env:
          BSD_KEY: ${{ secrets.BSD_KEY }}
      - run: |
          git config user.name "pronostici-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/bsd-test.html
          git diff --cached --quiet || (git commit -m "Test BSD" && git push)
